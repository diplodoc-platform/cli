name: Verify published CLI
run-name: 'Verify published CLI: ${{ inputs.version }}'

# Dispatched by Release only after a successful stable npm publish.
# workflow_dispatch also permits rechecking an existing stable version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact published stable CLI version'
        required: true
        type: string

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install and start published CLI
        env:
          CLI_VERSION: ${{ inputs.version }}
          NPM_CONFIG_CACHE: ${{ runner.temp }}/cli-install-cache
          NPM_CONFIG_USERCONFIG: /dev/null
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLI_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Expected an exact stable version'
            exit 1
          }
          for attempt in 1 2 3; do
            cd "$(mktemp -d)"
            printf '{"private":true}\n' > package.json
            if npm install "@diplodoc/cli@$CLI_VERSION" --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000; then
              ./node_modules/.bin/yfm --version
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 15
          done
