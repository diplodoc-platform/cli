name: Verify published CLI
run-name: 'Verify published CLI: release run #${{ github.event.workflow_run.id }}'

on:
  workflow_run:
    workflows: ['Release Package to npm']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify published CLI installation
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'release' ||
       (github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.display_title == 'Release Package to npm'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve published stable version
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            let version;
            if (run.event === 'workflow_dispatch') {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                ...context.repo,
                run_id: run.id,
                attempt_number: run.run_attempt,
                per_page: 100,
              });
              if (!jobs.some(job => job.name === 'Publish to npm' &&
                job.steps.some(step => step.name === 'Publish stable to npm' && step.conclusion === 'success'))) {
                core.info('No successful stable publication in this attempt.');
                return;
              }
              const {data: file} = await github.rest.repos.getContent({
                ...context.repo,
                path: 'package.json',
                ref: run.head_sha,
              });
              version = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8')).version;
            } else {
              const {data: release} = await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag: run.head_branch,
              });
              if (release.draft || release.prerelease) {
                core.info('Skipping a non-stable release.');
                return;
              }
              version = run.head_branch.replace(/^v/, '');
            }
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
              core.setFailed('Expected an exact stable CLI version.');
              return;
            }
            core.setOutput('version', version);

      - uses: actions/setup-node@v4
        if: steps.release.outputs.version != ''
        with:
          node-version: '24'

      - name: Install and start published CLI
        if: steps.release.outputs.version != ''
        env:
          CLI_VERSION: ${{ steps.release.outputs.version }}
          NPM_CONFIG_CACHE: ${{ runner.temp }}/cli-install-cache
          NPM_CONFIG_USERCONFIG: /dev/null
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLI_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Expected an exact stable version'
            exit 1
          }
          for attempt in {1..10}; do
            cd "$(mktemp -d)"
            printf '{"private":true}\n' > package.json
            if npm install "@diplodoc/cli@$CLI_VERSION" --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000; then
              ./node_modules/.bin/yfm --version
              exit 0
            fi
            if [[ "$attempt" == 10 ]]; then exit 1; fi
            sleep 60
          done
