# ⚠️ IMPORTANT: This workflow is a template from diplodoc/lint/scaffolding
# Do not edit this file in other packages - it is automatically copied from here.
# To modify this workflow, edit it in diplodoc/devops/lint/scaffolding/.github/workflows/
# and then run the scaffolding update process.

name: Update Dependencies

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name to update (single selection)'
        required: false
        type: choice
        options:
          # === packages ===
          - '@diplodoc/ajv'
          - '@diplodoc/client'
          - '@diplodoc/components'
          - '@diplodoc/directive'
          - '@diplodoc/liquid'
          - '@diplodoc/sentenizer'
          - '@diplodoc/transform'
          - '@diplodoc/translation'
          - '@diplodoc/utils'
          - '@diplodoc/vsc'
          - '@diplodoc/yfmlint'
          # === extensions ===
          - '@diplodoc/algolia-extension'
          - '@diplodoc/color-extension'
          - '@diplodoc/cut-extension'
          - '@diplodoc/file-extension'
          - '@diplodoc/folding-headings-extension'
          - '@diplodoc/html-extension'
          - '@diplodoc/latex-extension'
          - '@diplodoc/mermaid-extension'
          - '@diplodoc/openapi-extension'
          - '@diplodoc/page-constructor-extension'
          - '@diplodoc/quote-link-extension'
          - '@diplodoc/search-extension'
          - '@diplodoc/tabs-extension'

      update_as_dev:
        description: 'Update as devDependency (only for single package selection)'
        required: false
        type: boolean
        default: false
      packages:
        description: 'Package names to update (comma-separated, e.g., "@diplodoc/transform,dev:@diplodoc/client"). Use "dev:" prefix for devDependencies. If empty, uses single package selection above.'
        required: false
        type: string
      version:
        description: 'Package version (use "latest" for latest version)'
        required: true
        type: string
        default: 'latest'
      create_pr:
        description: 'Create PR when running on a non-master branch. Ignored on master.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-package:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      branch: ${{ steps.publish.outputs.branch }}
      pr_number: ${{ steps.publish.outputs.pr_number }}
      pr_url: ${{ steps.publish.outputs.pr_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.YC_UI_BOT_GITHUB_TOKEN }}

      - name: Setup Node.js and install dependencies
        uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          registry-url: 'https://registry.npmjs.org'

      - name: Update packages
        # workflow_dispatch inputs are user-controlled. Never interpolate them
        # directly into a shell script (${{ inputs.* }} in run:) — pass them
        # through env: and reference as "$VAR" so quotes / $(...) / ;-chains
        # in input values cannot escape into the shell.
        env:
          INPUT_PACKAGES: ${{ inputs.packages }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_UPDATE_AS_DEV: ${{ inputs.update_as_dev }}
        run: |
          set -e

          # Determine which packages to update
          if [[ -n "$INPUT_PACKAGES" ]]; then
            # Use multi-selection field with dev: prefix support
            # Parse comma-separated packages
            IFS=',' read -ra PACKAGES <<< "$INPUT_PACKAGES"

            for PACKAGE_ENTRY in "${PACKAGES[@]}"; do
              # Trim whitespace
              PACKAGE_ENTRY=$(echo "$PACKAGE_ENTRY" | xargs)

              # Check for dev: prefix
              if [[ "$PACKAGE_ENTRY" == dev:* ]]; then
                PACKAGE="${PACKAGE_ENTRY#dev:}"
                echo "::info::Updating $PACKAGE to $INPUT_VERSION as devDependency"
                npm install --no-workspaces --save-dev "$PACKAGE@$INPUT_VERSION"
              else
                PACKAGE="$PACKAGE_ENTRY"
                echo "::info::Updating $PACKAGE to $INPUT_VERSION"
                npm install --no-workspaces "$PACKAGE@$INPUT_VERSION"
              fi
            done
          elif [[ -n "$INPUT_PACKAGE" ]]; then
            # Use single selection field
            PACKAGE="$INPUT_PACKAGE"

            if [[ "$INPUT_UPDATE_AS_DEV" == "true" ]]; then
              echo "::info::Updating $PACKAGE to $INPUT_VERSION as devDependency"
              npm install --no-workspaces --save-dev "$PACKAGE@$INPUT_VERSION"
            else
              echo "::info::Updating $PACKAGE to $INPUT_VERSION"
              npm install --no-workspaces "$PACKAGE@$INPUT_VERSION"
            fi
          else
            echo "::error::Either package or packages must be specified"
            exit 1
          fi

      - name: Regenerate package-lock.json for standalone mode
        run: npm install --no-workspaces --package-lock-only

      - name: Create and publish PR
        id: publish
        env:
          GH_TOKEN: ${{ secrets.YC_UI_BOT_GITHUB_TOKEN }}
          # See "Update packages" step above — inputs go through env, never
          # via ${{ inputs.* }} into the shell body.
          INPUT_PACKAGES: ${{ inputs.packages }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_UPDATE_AS_DEV: ${{ inputs.update_as_dev }}
          INPUT_CREATE_PR: ${{ inputs.create_pr }}
        run: |
          set -e

          # Determine the base branch from the branch selected in the GitHub
          # Actions UI (workflow_dispatch). GITHUB_REF_NAME is automatically
          # set by the runner (e.g. "master", "feature/foo").
          BASE_BRANCH="${GITHUB_REF_NAME:-master}"
          echo "branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"

          # Check if there are any changes
          if [[ -n $(git status --porcelain -- package.json package-lock.json) ]]; then
            CHANGED=true
          else
            CHANGED=false
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

          # On master there is nothing to do without changes: the dedicated
          # update branch and its PR are created from the diff itself.
          # On a non-master branch with create_pr an existing PR may still need
          # to be reported, so keep going.
          if [[ "$CHANGED" != "true" && ( "$BASE_BRANCH" == "master" || "$INPUT_CREATE_PR" != "true" ) ]]; then
            echo "::notice::Nothing to update"
            exit 0
          fi

          # Determine which packages to update
          FIRST_PACKAGE=""
          if [[ -n "$INPUT_PACKAGES" ]]; then
            # Use multi-selection field with dev: prefix support
            # Parse comma-separated packages
            IFS=',' read -ra PACKAGES <<< "$INPUT_PACKAGES"

            # Get actual installed versions for all packages
            VERSIONS=""
            for PACKAGE_ENTRY in "${PACKAGES[@]}"; do
              # Trim whitespace
              PACKAGE_ENTRY=$(echo "$PACKAGE_ENTRY" | xargs)

              # Check for dev: prefix
              if [[ "$PACKAGE_ENTRY" == dev:* ]]; then
                PACKAGE="${PACKAGE_ENTRY#dev:}"
                DEV_PREFIX="dev:"
              else
                PACKAGE="$PACKAGE_ENTRY"
                DEV_PREFIX=""
              fi

              VERSION=$(npm explore --no-workspaces "$PACKAGE" "node -pe 'require(\"./package.json\").version'" --shell sh)
              if [[ -n "$VERSIONS" ]]; then
                VERSIONS="$VERSIONS, "
              fi
              VERSIONS="$VERSIONS$DEV_PREFIX$PACKAGE@$VERSION"
            done
            FIRST_PACKAGE=$(echo "$INPUT_PACKAGES" | cut -d',' -f1 | xargs)
          elif [[ -n "$INPUT_PACKAGE" ]]; then
            # Use single selection field
            PACKAGE="$INPUT_PACKAGE"
            VERSION=$(npm explore --no-workspaces "$PACKAGE" "node -pe 'require(\"./package.json\").version'" --shell sh)

            if [[ "$INPUT_UPDATE_AS_DEV" == "true" ]]; then
              VERSIONS="dev:$PACKAGE@$VERSION"
            else
              VERSIONS="$PACKAGE@$VERSION"
            fi
            FIRST_PACKAGE="$PACKAGE"
          else
            echo "::error::Either package or packages must be specified"
            exit 1
          fi

          # Configure git
          git config --global user.email "95919151+yc-ui-bot@users.noreply.github.com"
          git config --global user.name "yc-ui-bot"

          # Create branch name — sanitize FIRST_PACKAGE so a hostile npm name
          # (e.g. one containing `/`, spaces, or `;`) cannot escape into the
          # branch ref or surrounding git commands.
          FIRST_PACKAGE=$(echo "$FIRST_PACKAGE" | sed 's/^dev://; s/@//g')
          SAFE_FIRST_PACKAGE=$(echo "$FIRST_PACKAGE" | tr -c 'A-Za-z0-9._-' '_')
          SAFE_VERSION=$(echo "$INPUT_VERSION" | tr -c 'A-Za-z0-9._-' '_')
          BRANCH_NAME="ci/update-deps/${SAFE_FIRST_PACKAGE}-${SAFE_VERSION}"

          if [[ "$BASE_BRANCH" == "master" ]]; then
            # For master: create a dedicated branch, push, and open a PR.
            # create_pr is ignored here — this path always opens a PR.
            git push -f origin ":$BRANCH_NAME" || true
            git checkout -b "$BRANCH_NAME"
            git add package.json package-lock.json
            git commit -m "fix(deps): Update $VERSIONS" --no-verify
            git push -u origin "$BRANCH_NAME"

            PR_URL=$(gh pr create --title "fix(deps): Update $VERSIONS" \
              --body "Automated dependency update" --base "$BASE_BRANCH" --head "$BRANCH_NAME")
            echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
            echo "pr_number=${PR_URL##*/}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For non-master branches: commit directly to the selected branch.
          if [[ "$CHANGED" == "true" ]]; then
            git add package.json package-lock.json
            git commit -m "fix(deps): Update $VERSIONS" --no-verify
            git push origin "$BASE_BRANCH"
            echo "::notice::Commit pushed to $BASE_BRANCH"
          fi

          # Without create_pr the author opens the PR themselves — historical
          # behaviour, kept as the default.
          if [[ "$INPUT_CREATE_PR" != "true" ]]; then
            exit 0
          fi

          # Idempotent PR create-or-reuse: a re-run on the same branch must not
          # produce a second PR.
          EXISTING=$(gh pr list --head "$BASE_BRANCH" --base master --state open \
            --json number,url --jq '.[0] // empty')

          if [[ -n "$EXISTING" ]]; then
            PR_NUMBER=$(echo "$EXISTING" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).number')
            PR_URL=$(echo "$EXISTING" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).url')
            echo "::notice::Reusing existing PR #$PR_NUMBER"
          else
            # Fails when the branch has no commits ahead of master; that is not
            # an error for a no-op re-run.
            if ! PR_URL=$(gh pr create --title "fix(deps): Update $VERSIONS" \
              --body "Automated dependency update" --base master --head "$BASE_BRANCH"); then
              echo "::notice::No PR created for $BASE_BRANCH"
              exit 0
            fi
            PR_NUMBER="${PR_URL##*/}"
            echo "::notice::Created PR #$PR_NUMBER"
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
