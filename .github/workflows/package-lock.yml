# Do not edit this file in other packages - it is automatically copied from here.
# To modify this workflow, edit it in diplodoc/devops/lint/scaffolding/.github/workflows/
# and then run the scaffolding update process.

name: Update package-lock.json

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  verify-dependabot-lock:
    name: Verify Dependabot lockfile
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dependency update
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Node.js without installing candidate scripts
        uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          cache: ''
          run-install: 'false'
      - name: Validate the existing lockfile
        run: npm ci --no-workspaces --ignore-scripts
      - name: Summary
        run: echo 'Dependabot owns this lockfile. npm ci validated it without lifecycle scripts; no bot token or write-back is used.' >> "$GITHUB_STEP_SUMMARY"

  update-package-lock:
    name: Regenerate package-lock.json
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Dependabot maintains its own lockfile and must not receive the writer token.
    # Use the PR author, not only the actor, to preserve this boundary on reruns.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.YC_UI_BOT_GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          registry-url: 'https://registry.npmjs.org'
          run-install: 'false'

      - name: Regenerate package-lock.json
        run: npm install --no-workspaces --package-lock-only --ignore-scripts

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.YC_UI_BOT_GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -e

          # Check if there are any changes
          if [[ -z $(git diff --stat | grep package-lock.json) ]]; then
            echo "::info::Nothing to update"
            exit 0
          fi

          # Configure git
          git config --global user.email "95919151+yc-ui-bot@users.noreply.github.com"
          git config --global user.name "yc-ui-bot"

          git add package-lock.json
          git fetch origin "${BRANCH_NAME}"
          REMOTE_TIP="$(git rev-parse "origin/${BRANCH_NAME}")"

          git commit --amend --no-edit --no-verify
          if git push --force-with-lease origin "HEAD:${BRANCH_NAME}"; then
            echo "::notice::Pushed amended lockfile commit on ${BRANCH_NAME}"
          else
            echo "::warning::Force-push failed, falling back to a regular commit"
            git reset --soft "${REMOTE_TIP}"
            git commit -m "chore: Update package-lock.json" --no-verify
            git push origin "HEAD:${BRANCH_NAME}"
          fi

  package-lock-result:
    name: Update package-lock.json
    needs: [verify-dependabot-lock, update-package-lock]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Require the applicable lockfile check to succeed
        env:
          LOCK_RESULT: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && needs.verify-dependabot-lock.result || needs.update-package-lock.result }}
        run: |
          echo "Applicable lockfile check: $LOCK_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$LOCK_RESULT" = success
