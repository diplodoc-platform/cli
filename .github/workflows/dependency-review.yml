# Do not edit this file in other packages - it is automatically copied from here.
# To modify this workflow, edit it in diplodoc/devops/infra/scaffolding/.github/workflows/
# and then run the scaffolding update process.

name: Dependency Review

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Dependency Review
        uses: actions/dependency-review-action@v4.9.0
        with:
          # Fail the check for high and critical vulnerabilities.
          # Moderate and low are reported but do not block the PR.
          fail-on-severity: high
          # License checks are enabled; deny strong copyleft licenses
          # incompatible with the permissive MIT-licensed Diplodoc platform.
          license-check: true
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0, LGPL-2.1, LGPL-3.0, SSPL-1.0
